<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSwap</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        .card-overlay {
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .card-container:hover .card-overlay {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <nav class="bg-white w-full border-b border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="#" class="flex items-center space-x-3">
                <img src="logo.webp" class="h-10 rounded-xl" alt="BookSwap Logo" />
                <span class="text-xl font-semibold">BookSwap</span>
            </a>

            <div class="hidden md:flex md:w-auto">
                <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 md:flex-row md:space-x-8">
                    <li><a href="#" class="block py-2 px-3 text-blue-600">Home</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">About</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Services</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Pricing</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-700 hover:text-blue-600">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex gap-10 p-10">

        <div class="w-80 rounded-xl bg-white p-4 shadow-lg border border-gray-100 h-fit">
            <div class="p-4 mb-2 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-800 mb-2">Rechercher</h2>
                <input type="text" placeholder="Titre du livre" id="searchLivre"
                    class="p-2 border rounded-lg w-full outline-none focus:border-blue-500">
            </div>

            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-2">Type d'échange</h2>
                <div class="flex flex-col gap-2 typeEchange">
                    <label class="flex items-center gap-2"><input type="radio" value="tous" name="typeEchange">
                        Tous</label>
                    <label class="flex items-center gap-2"><input type="radio" value="definitif" name="typeEchange">
                        Définitif</label>
                    <label class="flex items-center gap-2"><input type="radio" value="temporaire" name="typeEchange">
                        Temporaire</label>
                </div>
            </div>

            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800 mb-2">Catégorie</h2>
                <select
                    class="categories border border-gray-300 rounded-lg w-full p-2 outline-none focus:border-blue-500">
                    <option value="">Toutes les catégories</option>

                </select>
            </div>

            <div class="p-4" id="actualiser">
                <button type="button"
                    class="bg-blue-600 hover:bg-blue-700 w-full p-2 rounded-lg text-white font-medium transition">
                    <i class="fa-solid fa-arrows-rotate mr-2"></i> Actualiser
                </button>
            </div>
        </div>





        <div class="flex flex-wrap  gap-6 container">
            <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-current border-e-transparent align-[-0.125em] text-surface motion-reduce:animate-[spin_1.5s_linear_infinite] dark:text-red"
                role="status">
            </div>

        </div>

        </div>

    </main>

    <script src="main.js"></script>
</body>

</html>
